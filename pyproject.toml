[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-workload-forecasting"
version = "1.0.0"
description = "Candidate starter utilities for a cloud workload forecasting take-home"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.scripts]
cwfc-predict = "cwfc.predict:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "jupyterlab>=4.0", "ipykernel>=6.25", "nbclient>=0.9", "nbformat>=5.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
